name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review with Codex
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Skip when OPENAI_API_KEY is not configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "OPENAI_API_KEY is not configured; skipping Codex PR review."

      - name: Check out pull request merge
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Fetch base and head refs
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run Codex review
        if: ${{ env.OPENAI_API_KEY != '' }}
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: ${{ runner.temp }}/codex-review.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      - name: Post Codex feedback
        if: ${{ steps.run_codex.outputs.final-message != '' }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE || "";
            if (!body.trim()) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `<!-- codex-pr-review -->\n${body}`,
            });
