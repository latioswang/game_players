name: Codex PR autofix

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to fix
        required: true
        type: number

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: codex-pr-autofix-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Fix PR feedback with Codex
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          CODEX_AUTOFIX_ON_REVIEW: ${{ vars.CODEX_AUTOFIX_ON_REVIEW }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");

            let prNumber = null;
            let shouldRun = false;
            let reason = "";
            const codexActors = new Set(["chatgpt-codex-connector", "github-actions[bot]"]);
            const isCodexAuthored = (user) => codexActors.has(user?.login || "");
            const hasCodexReviewMarker = (body) =>
              body.includes("<!-- codex-pr-review -->") ||
              body.includes("Codex PR review") ||
              body.includes("### 💡 Codex Review");

            if (context.eventName === "workflow_dispatch") {
              prNumber = Number(core.getInput("pr_number"));
              shouldRun = true;
              reason = "manual workflow dispatch";
            } else if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body || "";
              prNumber = issue?.number;
              const requestedFix = Boolean(issue?.pull_request) && /(^|\n)\/codex fix\b/i.test(body);
              const codexReviewComment =
                Boolean(issue?.pull_request) &&
                isCodexAuthored(context.payload.comment?.user) &&
                hasCodexReviewMarker(body);
              if (requestedFix) {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: context.payload.comment.user.login,
                });
                const trusted = ["admin", "maintain", "write"].includes(permission.permission);
                if (!trusted) {
                  core.setOutput("should_run", "false");
                  core.setOutput("skip_reason", "/codex fix can only be run by users with write access.");
                  return;
                }
              }
              shouldRun = requestedFix || codexReviewComment;
              reason = requestedFix
                ? "PR comment requested /codex fix"
                : "Codex review comment requested autofix";
            } else if (context.eventName === "pull_request_review") {
              const reviewState = (context.payload.review?.state || "").toLowerCase();
              const reviewBody = context.payload.review?.body || "";
              const codexReview =
                isCodexAuthored(context.payload.review?.user) &&
                hasCodexReviewMarker(reviewBody);
              prNumber = context.payload.pull_request?.number;
              shouldRun =
                ["changes_requested", "commented"].includes(reviewState) &&
                (codexReview || process.env.CODEX_AUTOFIX_ON_REVIEW === "true");
              reason = codexReview
                ? "Codex PR review requested autofix"
                : "CODEX_AUTOFIX_ON_REVIEW handled PR review";
            }

            if (!prNumber || !shouldRun) {
              core.setOutput("should_run", "false");
              core.setOutput("skip_reason", "No trusted autofix trigger matched.");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const sameRepo = pr.head.repo.full_name === `${owner}/${repo}`;
            let headBranchExists = false;
            if (sameRepo && pr.state === "open") {
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${pr.head.ref}`,
                });
                headBranchExists = true;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
            const canRun = pr.state === "open" && sameRepo && headBranchExists && !pr.draft;

            core.setOutput("should_run", String(canRun));
            core.setOutput(
              "skip_reason",
              canRun
                ? ""
                : "Autofix only runs on open, non-draft PRs with an existing same-repository head branch.",
            );
            core.setOutput("reason", reason);
            core.setOutput("number", String(pr.number));
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("html_url", pr.html_url);

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const trim = (value, limit = 3000) => {
              const text = value || "";
              return text.length > limit ? `${text.slice(0, limit)}\n...[truncated]` : text;
            };

            const contextPath = `${process.env.RUNNER_TEMP}/codex-pr-context.md`;
            const lines = [
              `# Pull request context`,
              ``,
              `PR: #${pr.number} ${pr.title}`,
              `URL: ${pr.html_url}`,
              `Base: ${pr.base.ref}`,
              `Head: ${pr.head.ref} (${pr.head.sha})`,
              `Trigger: ${reason}`,
              ``,
              `## PR body`,
              trim(pr.body || "(empty)"),
              ``,
              `## Issue comments`,
              ...issueComments.map((comment) => [
                ``,
                `### ${comment.user?.login || "unknown"} at ${comment.created_at}`,
                trim(comment.body),
              ].join("\n")),
              ``,
              `## Review submissions`,
              ...reviews.map((review) => [
                ``,
                `### ${review.user?.login || "unknown"} ${review.state} at ${review.submitted_at || review.updated_at}`,
                trim(review.body),
              ].join("\n")),
              ``,
              `## Inline review comments`,
              ...reviewComments.map((comment) => [
                ``,
                `### ${comment.user?.login || "unknown"} on ${comment.path}:${comment.line || comment.original_line || "unknown"}`,
                trim(comment.body),
              ].join("\n")),
              ``,
            ];

            fs.writeFileSync(contextPath, lines.join("\n"));
            core.setOutput("context_path", contextPath);

      - name: Skip
        if: ${{ steps.pr.outputs.should_run != 'true' }}
        run: echo "${{ steps.pr.outputs.skip_reason }}"

      - name: Skip when OPENAI_API_KEY is not configured
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY == '' }}
        run: |
          echo "OPENAI_API_KEY is not configured; skipping Codex PR autofix."

      - name: Check out pull request branch
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        run: git fetch --no-tags origin refs/heads/${{ steps.pr.outputs.base_ref }}:refs/remotes/origin/${{ steps.pr.outputs.base_ref }}

      - name: Run Codex autofix
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/autofix.md
          output-file: ${{ runner.temp }}/codex-autofix.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
        env:
          CODEX_PR_CONTEXT: ${{ steps.pr.outputs.context_path }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      - name: Install test dependencies
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        run: python -m pip install -e "2048[dev]"

      - name: Run tests
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        run: python -m pytest 2048/tests

      - name: Commit and push fixes
        if: ${{ steps.pr.outputs.should_run == 'true' && env.OPENAI_API_KEY != '' }}
        run: |
          if git diff --quiet; then
            echo "Codex did not modify tracked files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Codex PR fixes"
          git push origin HEAD:refs/heads/${{ steps.pr.outputs.head_ref }}
