[project]
name = "game-players"
version = "0.1.0"
description = "A fast heuristic Expectimax player for 2048."
requires-python = ">=3.10"
dependencies = ["glog", "numba", "numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
game-players = "game_players.cli:main"

[tool.setuptools.packages.find]
include = ["game_players*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
