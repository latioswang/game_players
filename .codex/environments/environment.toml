python3 -m venv "$shared_venv"
if [ -L .venv ]; then
    rm .venv
elif [ -e .venv ]; then
    echo ".venv already exists and is not a symlink; move it aside before using the shared Codex venv." >&2
    exit 1
fi
ln -s "$shared_venv" .venv
. "$shared_venv/bin/activate"
python -m pip install -U pip
pyproject_hash=$(python -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$package_dir/pyproject.toml")
marker="$shared_venv/.game_players_pyproject_hash"
if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$pyproject_hash" ]; then
    cd "$package_dir"
    python -m pip install ".[dev]"
    printf "%s" "$pyproject_hash" > "$marker"
fi
export PYTHONPATH="$package_path${PYTHONPATH:+:$PYTHONPATH}"
"""

