elif [ -f 2048/pyproject.toml ]; then
    package_dir=2048
else
    echo "No pyproject.toml found at the repository root or under 2048/." >&2
    exit 1
fi
package_path="$PWD/$package_dir"
py_tag=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
